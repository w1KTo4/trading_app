server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tradingdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:change-me-super-secret-change-me-super-secret}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

logging:
  level:
    org.springframework.security: INFO

market-data:
  api-key: ${TWELVE_DATA_API_KEY:}
  base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
  focus-poll-delay-ms: ${MARKET_DATA_FOCUS_POLL_DELAY_MS:5000}
  universe-poll-delay-ms: ${MARKET_DATA_UNIVERSE_POLL_DELAY_MS:60000}
  focus-ttl-seconds: ${MARKET_DATA_FOCUS_TTL_SECONDS:120}
  max-focus-symbols: ${MARKET_DATA_MAX_FOCUS_SYMBOLS:8}
