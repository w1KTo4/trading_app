services:
  mysql:
    image: mysql:8.4
    container_name: trading-mysql
    environment:
      MYSQL_DATABASE: tradingdb
      MYSQL_USER: trading
      MYSQL_PASSWORD: trading
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: trading-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tradingdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: trading
      SPRING_DATASOURCE_PASSWORD: trading
      JWT_SECRET: super-secret-jwt-key-change-in-production-123456
      TRUSTPAY_ENABLED: "true"
      TRUSTPAY_SUBMIT_URL: https://trustpay-backend-1orv.onrender.com/api/v1/payments/submit-code
      TRUSTPAY_STORE_NAME: TradingStation
      WEBHOOK_SECRET_TRUSTPAY: trustpay-local-dev-secret
      TRUSTPAY_DEV_WEBHOOK_SECRET: trustpay-local-dev-secret
      TRUSTPAY_PUBLIC_BASE_URL: ${TRUSTPAY_PUBLIC_BASE_URL:-}
      TRUSTPAY_REQUIRE_WEBHOOK_SIGNATURE: "false"
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*,https://trustpay-iota.vercel.app
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: trading-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
